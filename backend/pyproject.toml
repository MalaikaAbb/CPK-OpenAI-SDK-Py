[project]
name = "copilotkit-openai-agents-python-backend"
version = "0.1.0"
description = "AG-UI agent server for the CopilotKit + OpenAI Agents SDK (Python) test harness"
# The Quickstart's prerequisites say Python 3.10+.
requires-python = ">=3.10"

# Exactly the Quickstart's install line:
#   uv add openai-agents ag-ui-openai-agents fastapi uvicorn
# https://docs.copilotkit.ai/openai-agents-python/quickstart
# Anything added later is listed below with the page that needs it.
dependencies = [
    "openai-agents>=0.24.0",
    "ag-ui-openai-agents>=0.1.0",
    "fastapi>=0.115.12",
    "uvicorn>=0.34.0",
]

[tool.uv]
package = false
